<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d4aff">
  <title>موقعي التجريبي الأول</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #24213a;
      background: linear-gradient(135deg, #f3efff, #fff8f1);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 620px);
      padding: 38px 28px;
      text-align: center;
      background: rgba(255,255,255,.92);
      border: 1px solid #e9e1ff;
      border-radius: 24px;
      box-shadow: 0 18px 55px rgba(75, 48, 140, .12);
    }
    .icon { font-size: 54px; margin-bottom: 12px; }
    h1 { margin: 0 0 14px; color: #6543d6; font-size: clamp(26px, 6vw, 38px); }
    p { margin: 0 auto 24px; max-width: 440px; line-height: 1.9; color: #625d75; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 25px;
      color: white;
      background: #6d4aff;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(109, 74, 255, .22);
    }
    button:active { transform: scale(.98); }
    #message { min-height: 30px; margin-top: 18px; color: #4e329f; font-weight: bold; }
    footer { margin-top: 28px; color: #9a94aa; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">✨</div>
    <h1>مرحبًا بك في موقعي الأول!</h1>
    <p>
      هذه صفحة تجريبية صنعتها بملف HTML.
      جرّبي الضغط على الزر لتشاهدي تفاعل JavaScript.
    </p>
    <button type="button" onclick="showMessage()">اضغطي هنا</button>
    <div id="message" aria-live="polite"></div>
    <footer>صُنع للتدريب على GitHub Pages · 2026</footer>
  </main>
  <script>
    function showMessage() {
      document.getElementById('message').textContent = 'رائع! الزر يعمل بنجاح 🎉';
    }
  </script>
</body>
</html>
